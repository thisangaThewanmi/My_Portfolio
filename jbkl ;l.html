<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills Section</title>
  <style>
    :root {
      --second-bg-color: #f0f0f0; /* Replace with your actual secondary background color */
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--second-bg-color);
    }

    #skills {
      width: 95vw;
      height: 100vh;
      background: var(--second-bg-color);
      position: relative;
      margin-left: 31px;
      margin-top: 40px;
      justify-content: center;
      align-items: center;
    }

    #skillTopic > hr {
      border: 4px solid #15F770;
      width: 150px;
      position: absolute;
      top: 27px;
      left: 100px;
    }

    #skillImages {
      width: 60vw;
      height: 52vh;
      /* background: deeppink; */
      margin-left: 62px;
      display: flex;
      margin-top: 100px;
    }

    .skill-item {
      border-radius: 20px;
      overflow: hidden;
      margin-right: 12px;
      transition: width 0.3s ease-in-out;
    }

    .skill-item:hover {
      width: 800px;
      /* Adjust this value as needed */
    }
    .skill-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #jsImg {
      width: 167px;
      height: 132px;
      background: black;
      margin-top: 88px;
    }

    #hibernateImg {
      width: 175px;
      height: 199px;
      background: green;
      margin-top: 55px;
    }

    /* Common styles for all progress bars */
    progress {
      width: 100%;
      height: 10px;
      border: 2px #46424275;
      margin-bottom: 40px;
      border-radius: 20px;
    }

    /* Styles for progress bars inside #skillText */
    #skillText progress {
      background-color: rgba(19, 18, 18, 0.58); /* Light gray background */
    }

    /* Styles for progress bars inside #skillTextRight */
    #skillTextRight progress {
      background-color: rgba(19, 18, 18, 0.58); /* Light gray background */
    }

    /* Keyframes for progress bar animation */
    @keyframes progressAnimation {
      from { width: 0; }
    }

    /* Apply animation to progress bars */
    progress[value] {
      animation: progressAnimation 2s ease-out forwards;
    }

    /* Additional styles for progress bars */
    progress::-webkit-progress-value {
      background-color: #15F770; /* Green progress bar */
    }
    progress::-moz-progress-bar {
      background-color: #15F770; /* Green progress bar */
      border-radius: 20px;
    }

    #skillText > h5, #skillTextRight > h5 {
      font-size: 18px;
    }

    #progressBars {
      width: 55vw;
      height: 40vh;
      background: #46424275;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-gap: 60px;
      align-items: center;
      margin-left: 314px;
      margin-top: 30px;
      border-radius: 20px;
    }

    /* Styles for each grid item (div) */
    #skillText, #skillTextRight {
      padding: 20px; /* Add padding for spacing */
    }

    #skills h2 {
      font-size: 2em;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
<section id="skills">
  <h2>My Skills</h2>
  <div id="skillTopic">
    <hr>
  </div>
  <div id="skillImages">
    <div class="skill-item" id="jsImg">
      <img src="https://via.placeholder.com/167x132.png?text=JavaScript" alt="JavaScript" id="javaScript">
    </div>
    <div class="skill-item" id="hibernateImg">
      <img src="https://via.placeholder.com/175x199.png?text=Hibernate" alt="Hibernate" id="hibernate">
    </div>
    <div  class="skill-item" id="cssImg">
      <img class="imageSkill" src="assests/images/CSS.png">
    </div>
    <div  class="skill-item" id="IntelliJImg">
      <img class="imageSkill" src="assests/images/INTELLIJ.jpeg">
    </div>
    <div  class="skill-item" id="htmlImg">
      <img class="imageSkill" src="assests/images/HTML.png">
    </div>
    <div  class="skill-item" id="javaImg">
      <img class="imageSkill" src="assests/images/JAVA.png">
    </div>
    <div  class="skill-item" id="figmaImg">
      <img class="imageSkill" src="assests/images/figma.png">
    </div>
  </div>
  <div id="progressBars">
    <div id="skillText">
      <h5>JavaScript</h5>
      <progress value="70" max="100"></progress>
    </div>
    <div id="skillTextRight">
      <h5>Hibernate</h5>
      <progress value="80" max="100"></progress>
    </div>


  </div>
</section>
</body>
</html>
