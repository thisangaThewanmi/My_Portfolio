<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Services</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha384-k6RqeWeci5ZR/Lv4MR0sA0FfDOMfO/E7AEERB2zMJCSGgHYdU5e5evg4pGQbV7cs" crossorigin="anonymous">
    <style>

        @media all and (max-width: 1500px) {

            /* header section */
            .nav {
                width: 60%;
            }
        }


            @media all and (max-width: 1060px) {

                /* header section */
                .nav {
                    font-size: 20px;
                    width: 70%;
                }
            }

        @media all and (max-width: 830px) {

            /* header section */
            .logo {
                width: 63px;
                height: 30px;
            }

            .nav {
                visibility: hidden;
            }

            .dropdown {
                visibility: visible;
            }
        }
    </style>
</head>
<body>
<!-- header -->
<header>
    <div class="header">
        <div class="logo">
            <!-- left side -->
            <img src="images/index_page_images/header_images/senu%20logo.png" title="senu.lk" alt="senu logo" >
        </div>
        <!-- right side -->
        <nav class="nav">
            <a href="#" class="about">About</a>
            <a href="#" class="skills">Skills</a>
            <a href="#" class="projects">Projects</a>
            <a href="#" class="education">Education</a>
            <a href="#" class="contact">Contact</a>
            <a href="#" class="gallery">Gallery</a>
        </nav>
        <div class="dropdown">
            <button class="drop-btn"><i class="fa-solid fa-bars"></i></button>
            <div class="dropdown-content">
                <a href="#" class="about">About</a>
                <a href="#" class="skills">Skills</a>
                <a href="#" class="projects">Projects</a>
                <a href="#" class="education">Education</a>
                <a href="#" class="contact">Contact</a>
                <a href="#" class="gallery">Gallery</a>
            </div>
        </div>
    </div>
</header>
</body>
</html>
