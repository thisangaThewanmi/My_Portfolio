<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <style>
        .card {
            width: 40%;
            height: fit-content;
            border-radius: 4px;
            background: #212121;
            display: flex;
            gap: 5px;
            padding: .4em;
        }

        .card p {
            height: 100%;
            flex: 1;
            overflow: hidden;
            cursor: pointer;
            border-radius: 2px;
            transition: all .5s;
            background: #212121;
            border: 1px solid #ff5a91;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card p:hover {
            flex: 4;
            width: fit-content;
        }

        .card p img {
            min-width: 14em;
            padding: .5em;
            text-align: center;
            /*transform: rotate(-90deg);*/
            transition: all .5s;
            text-transform: uppercase;
            color: #ff568e;
            letter-spacing: .1em;
        }

        .card p:hover span {
            transform: rotate(0);
        }

    </style>
</head>
<body>
<div id="skillImages">
<div class="card">
    <p><img src="assests/images/New.png"></p>
    <p><img src="assests/images/javascript.png"></p>
    <p><img src="assests/images/jquery.png"></p>
    <p><img src="assests/images/java%20(1).png"></p>
    <p><img src="assests/images/html.png"></p>
    <p><img src="assests/images/New.png"></p>
</div>

<div class="card">
    <p><img src="assests/images/New.png"></p>
    <p><img src="assests/images/javascript.png"></p>
    <p><img src="assests/images/jquery.png"></p>
    <p><img src="assests/images/java%20(1).png"></p>
    <p><img src="assests/images/html.png"></p>
    <p><img src="assests/images/New.png"></p>
</div>
</div>

</body>
</html>
